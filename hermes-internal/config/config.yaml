# Hermes Agent — internal single-agent config (v0.20.0 / tag v2026.8.3)
#
# This file is CONFIG-AS-CODE. It is baked into the image and copied onto the
# HERMES_HOME volume ($HERMES_HOME/config.yaml, = /opt/data/config.yaml in the
# container) on every boot by docker/cont-init.d/03-hermes-internal-seed.
# Edit it here in the repo, not at runtime — a runtime edit is overwritten on
# the next boot.
#
# It is a PARTIAL config: unspecified keys fall back to Hermes' DEFAULT_CONFIG
# (hermes_cli/config_defaults.py). Only the keys this deployment cares about are
# set. Every key below is verified against the upstream source — see
# docs/hermes-facts.md for file:line citations. No key here is guessed.
#
# Secrets are NEVER written literally. They are ${env:VAR} references resolved
# from $HERMES_HOME/.env or the process environment (Railway variables).
# A missing ${env:VAR} keeps the literal placeholder and logs a warning, which
# fails loudly downstream rather than silently blanking — by design.

# --- Model ---------------------------------------------------------------
# PROHIBITS: hardcoding a model id or an API key in the repo — both come from
# env only, so a missing key fails loudly instead of running on a wrong default.
# provider reads its OWN API-key env var (e.g. OPENROUTER_API_KEY / NOUS_API_KEY
# / ANTHROPIC_API_KEY). See docs/hermes-facts.md §11 and .env.example.
# UNVERIFIED: the exact working (model id, provider) pair needs a real API key
# to validate (environment B). Set both via env; do not hardcode a model here.
model:
  default: ${env:HERMES_MODEL}          # e.g. "anthropic/claude-3.5-sonnet" (provider-specific id)
  provider: ${env:HERMES_MODEL_PROVIDER} # e.g. "openrouter", "nous", "anthropic", or "auto"

# --- Enabled tools (the real "allowlist") --------------------------------
# PROHIBITS: the LLM running a shell/terminal, executing code, delegating to
# subagents, or driving a browser. "safe" grants only web + vision + image_gen;
# every other tool is simply absent, so it cannot be invoked at all.
# Access control in Hermes is by TOOLSET, not a per-tool allowlist. "safe" is
# the upstream "Safe toolkit without terminal access". This is how "do not allow
# terminal unrestrictedly" is enforced.
# The daily endpoint health check does NOT rely on the LLM having terminal: it
# runs deterministically as a --no-agent cron script (see scripts/healthcheck.sh).
toolsets:
  - safe

# --- Approvals (allowlist / deny posture; NOT YOLO) ----------------------
# PROHIBITS: unattended auto-execution of approval-gated actions. mode "manual"
# requires explicit approval for each; "off" (YOLO/full-allow) is deliberately
# NOT used; cron_mode "deny" blocks such actions in cron; subagent_auto_approve
# false stops subagents from self-approving; and the deny globs below block
# matching shell commands unconditionally, before any bypass could apply.
approvals:
  mode: manual               # PROHIBITS: silent execution — each gated action needs approval
  cron_mode: deny            # PROHIBITS: approval-gated actions from running in cron (fail closed)
  smart_policy: ""           # unused under manual mode; left explicit
  denial_breaker_threshold: 3 # PROHIBITS: retry loops — 3 denials in a row → hard stop (0 disables)
  subagent_auto_approve: false # PROHIBITS: subagents auto-approving dangerous commands
  # PROHIBITS: the commands matched below, even if a future toolset enables
  # terminal and even under a bypass. fnmatch globs, case-insensitive; patterns
  # with * / {} / : must be quoted (upstream comment config_defaults.py:2063-2069).
  deny:
    - "rm -rf /*"
    - "rm -rf ~*"
    - "*curl*|*sh*"
    - "*wget*|*sh*"
    - "git push --force*"
    - "dd if=*"
    - "mkfs*"
    - "chmod -R 777*"

# PROHIBITS: pre-approving any dangerous shell command. Empty = nothing is
# pre-approved, so no shell command is ever waved through automatically.
# (The daily check runs via --no-agent, not through this path.)
command_allowlist: []

# --- Tool-loop guardrails ------------------------------------------------
# PROHIBITS: runaway tool use within a turn — caps web_search and subagent
# spawns per turn so a single turn cannot loop unbounded.
# NOTE: these caps are PER-TURN and reset each turn — they are NOT session-wide.
# The v0.20.0 release note's "session-wide" wording does not match a session
# key in the schema (see docs/hermes-facts.md §4 and docs/UNVERIFIED.md).
tool_loop_guardrails:
  loop_caps:
    max_web_searches: 10     # PROHIBITS: >10 web searches in one turn (default 50)
    max_subagents: 4         # PROHIBITS: >4 subagent spawns in one turn (default 50)

# --- Iteration + read caps (explicit; equal to upstream defaults) --------
# PROHIBITS: an unbounded agent loop (max_turns) and oversized single file reads
# (max_lines) that would blow up context.
agent:
  max_turns: 500             # PROHIBITS: more than 500 agent iterations in a run
tool_output:
  max_lines: 2000            # PROHIBITS: a single read_file returning >2000 lines

# --- Compression (explicit; equal to upstream defaults) ------------------
# PROHIBITS: unbounded context growth — history is compressed at 50% of the
# window, while always keeping at least the last real user message intact.
compression:
  enabled: true
  threshold: 0.50
  threshold_tokens: null
  min_tail_user_messages: 1
  model_thresholds: {}

# --- Logging -------------------------------------------------------------
# PROHIBITS: unbounded log files — rotation caps each at 5 MB × 3 backups.
# Destination is fixed to $HERMES_HOME/logs/ (agent.log, errors.log).
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3

# --- Outbound webhook notification (signed, HMAC-SHA256) -----------------
# PROHIBITS (as shipped): sending any outbound webhook — the whole block is
# commented out, so nothing is POSTed anywhere until an operator opts in.
# First-choice result/lifecycle notification (work order M5). Signature is sent
# as header `X-Hermes-Signature-256: sha256=<hexdigest>` over the raw JSON body.
# The RECEIVER is out of scope for this repo (verify per docs/hermes-facts.md §10).
# Disabled unless BOTH the URL and secret env vars are set — enable by
# uncommenting and providing HERMES_OUTBOUND_WEBHOOK_URL + the secret.
# Scope caveat: hooks.outbound carries AGENT LIFECYCLE events, not arbitrary
# report bodies; a --no-agent cron job may not emit one. See docs/UNVERIFIED.md.
#
# hooks:
#   outbound:
#     - name: internal-notify
#       url: ${env:HERMES_OUTBOUND_WEBHOOK_URL}
#       events: [on_session_end, subagent_stop]
#       secret_env: HERMES_OUTBOUND_WEBHOOK_SECRET
#       timeout: 10

# --- Messaging gateways (use case #4 — DEFERRED, placeholder only) -------
# PROHIBITS (as shipped): any messaging gateway (LINE/Slack/Discord/…). No
# platform block is active, so the agent is not reachable from any chat platform.
# LINE / Slack / Discord etc. are NOT enabled in this build. Each platform is a
# TOP-LEVEL key (not nested under gateway:), and tokens live in $HERMES_HOME/.env
# (e.g. SLACK_BOT_TOKEN, TELEGRAM_BOT_TOKEN), configured via `hermes gateway setup`.
# UNVERIFIED: exact LINE config/env keys (no line: section in DEFAULT_CONFIG).
#
# slack:
#   require_mention: true
#   allowed_channels: ""        # comma-separated channel IDs
# telegram: {}
